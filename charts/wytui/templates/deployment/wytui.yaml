apiVersion: apps/v1
kind: Deployment
metadata:
  name: wytui
  namespace: {{ .Release.Namespace }}
  labels:
    app: wytui
spec:
  replicas: 1
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: wytui
  template:
    metadata:
      labels:
        app: wytui
    spec:
      # 1001 is the image's own `nodejs` user/group (see the Dockerfile's adduser),
      # which every COPY in the image is chowned to. runAsGroup is set explicitly
      # so the process's gid is 1001 even if the image's /etc/passwd disagrees.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
      - name: migrate
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["npx", "prisma", "migrate", "deploy"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        {{- include "wytui.appEnv" . | nindent 8 }}
      containers:
      - name: wytui
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: false  # Need write access for tmp files
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        ports:
        - containerPort: 3000
        {{- if .Values.probes.enabled }}
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        {{- end }}
        env:
        # The shared helper also feeds the migrate init container, whose memory
        # limit is far lower, so the heap cap is set here on the app only.
        - name: NODE_OPTIONS
          value: {{ .Values.nodeOptions | quote }}
        {{- include "wytui.appEnv" . | nindent 8 }}
        volumeMounts:
        - name: downloads
          mountPath: /downloads
          {{- if .Values.downloads.persistent.subPath }}
          subPath: {{ .Values.downloads.persistent.subPath }}
          {{- end }}
        - name: library
          mountPath: /media
          {{- if .Values.library.persistent.subPath }}
          subPath: {{ .Values.library.persistent.subPath }}
          {{- end }}
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: {{ .Values.downloads.persistent.existingClaim | default "wytui-downloads" }}
      - name: library
        persistentVolumeClaim:
          claimName: {{ .Values.library.persistent.existingClaim | default "wytui-library" }}
