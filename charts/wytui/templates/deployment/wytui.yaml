apiVersion: apps/v1
kind: Deployment
metadata:
  name: wytui
  namespace: {{ .Release.Namespace }}
  labels:
    app: wytui
spec:
  replicas: 1
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: wytui
  template:
    metadata:
      labels:
        app: wytui
    spec:
      # 1001 is the image's own `nodejs` user/group (Dockerfile: addgroup -g 1001
      # -S nodejs && adduser -S -D -u 1001 -G nodejs nodejs), which every COPY in
      # the image is chowned to. The value previously here was the base image's
      # `node` user — a uid that owns no file in the image at all. runAsGroup is
      # set explicitly so the process's gid is 1001 even if the image's
      # /etc/passwd disagrees.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
      - name: migrate
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["npx", "prisma", "migrate", "deploy"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        {{- include "wytui.appEnv" . | nindent 8 }}
      containers:
      - name: wytui
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: false  # Need write access for tmp files
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        ports:
        - containerPort: 3000
        env:
        {{- include "wytui.appEnv" . | nindent 8 }}
        volumeMounts:
        - name: downloads
          mountPath: /downloads
          {{- if .Values.downloads.persistent.subPath }}
          subPath: {{ .Values.downloads.persistent.subPath }}
          {{- end }}
        - name: library
          mountPath: /media
          {{- if .Values.library.persistent.subPath }}
          subPath: {{ .Values.library.persistent.subPath }}
          {{- end }}
        {{- if .Values.config.persistent.enabled }}
        - name: config
          mountPath: /app/data  # Cookie uploads (settings.cookiePath) land here
          {{- if .Values.config.persistent.subPath }}
          subPath: {{ .Values.config.persistent.subPath }}
          {{- end }}
        {{- end }}
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: {{ .Values.downloads.persistent.existingClaim | default "wytui-downloads" }}
      - name: library
        persistentVolumeClaim:
          claimName: {{ .Values.library.persistent.existingClaim | default "wytui-library" }}
      {{- if .Values.config.persistent.enabled }}
      - name: config
        persistentVolumeClaim:
          claimName: {{ .Values.config.persistent.existingClaim | default "wytui-config" }}
      {{- end }}
