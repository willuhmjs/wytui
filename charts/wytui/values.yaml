image:
  repository: ghcr.io/willuhmjs/wytui
  tag: latest
  pullPolicy: IfNotPresent

strategy:
  type: Recreate

ingress:
  enabled: true
  className: traefik
  domain: wytui.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: wytui-tls

secret:
  existing: false
  name: wytui-secret
  authSecret: ''
  authSecretKey: AUTH_SECRET

# Extra environment variables for the app container, e.g. queue concurrency:
#   - name: QUEUE_MAX_DOWNLOADS
#     value: "4"
extraEnv: []

oidc:
  enabled: false
  name: oidc
  secret:
    existing: false
    name: wytui-oidc-secret
    clientId: wytui
    clientIdKey: OIDC_CLIENT_ID
    clientSecret: ''
    clientSecretKey: OIDC_CLIENT_SECRET
    issuer: ''
    issuerKey: OIDC_ISSUER_URL

postgresql:
  enabled: true
  image: postgres:18-alpine
  database: wytui
  secret:
    existing: false
    name: wytui-postgresql-secret
    url: ''
    urlKey: DATABASE_URL
    username: wytui
    usernameKey: POSTGRES_USER
    password: ''
    passwordKey: POSTGRES_PASSWORD
  persistent:
    existingClaim: ''
    subPath: ''
    size: 5Gi
    storageClass: ''
    accessModes:
      - ReadWriteOnce

downloads:
  persistent:
    existingClaim: ''
    subPath: ''
    size: 5Gi
    storageClass: ''
    accessModes:
      - ReadWriteOnce

library:
  persistent:
    # If you point this at a volume other workloads also write (e.g. an existing
    # shared library PVC), read the fsGroup caveat first: the pod-level fsGroup
    # used in templates/deployment/wytui.yaml applies to EVERY volume in this
    # pod, so mounting a shared volume makes kubelet re-apply group ownership and
    # permissions across that whole volume at mount time — including files the
    # other apps created. Prefer a dedicated volume, or agree on one shared gid
    # plus 2775 dir / 0664 file conventions with those apps instead of relying on
    # fsGroup — the app itself never sets an umask or a group-friendly mode (it
    # mkdirs with the 0755 default), so a group-writable layout has to be
    # established outside the app.
    existingClaim: ''
    subPath: ''
    size: 10Gi
    storageClass: ''
    accessModes:
      - ReadWriteOnce

# Network policy configuration
networkPolicy:
  enabled: false
