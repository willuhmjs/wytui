services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Run ./docker-init.sh to auto-generate secure credentials.}
      POSTGRES_DB: ${POSTGRES_DB:-wytui}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wytui}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy"

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wytui}?schema=public
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set. Run ./docker-init.sh to auto-generate secure credentials.}
      - AUTH_TRUST_HOST=true
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - downloads:/downloads
      - library:/media
      # Parity with the chart's `config` volume: cookie uploads land in
      # /app/data and settings.cookiePath (the DB) stores that path, so without
      # this volume every `docker compose up` leaves cookiePath pointing at a
      # file that no longer exists. NOTE: the image does not create /app/data,
      # so Docker cannot copy its ownership into a fresh named volume and the
      # volume root comes up root:root 0755 — the app (uid 1001) then gets
      # EACCES writing there. Needs `RUN mkdir -p /app/data && chown
      # nodejs:nodejs /app/data` in the Dockerfile to be writable.
      - config:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  downloads:
  library:
  config:
