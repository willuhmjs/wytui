name: Package and Publish Helm Chart

on:
  push:
    branches: [main, master]
    paths:
      - 'charts/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Classic Helm chart repository served from docs/charts via GitHub Pages
  # (same site as wytui.willuhmjs.com, just a subpath — see docs/index.html).
  CHART_REPO_URL: https://wytui.willuhmjs.com/charts

jobs:
  helm:
    if: github.repository == 'willuhmjs/wytui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package charts/wytui

      - name: Push chart to GHCR
        run: helm push wytui-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}

      - name: Add chart to repository index
        run: |
          mkdir -p docs/charts
          cp wytui-*.tgz docs/charts/
          helm repo index docs/charts --url "${{ env.CHART_REPO_URL }}"

      - name: Commit updated chart index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/charts
          if git diff --cached --quiet; then
            echo "No chart index changes to publish"
          else
            git commit -m "chore: publish Helm chart to index.yaml"
            git push
          fi
